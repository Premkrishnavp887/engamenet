<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="plumBg2" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#461B43"/>
      <stop offset="55%" stopColor="#34112F"/>
      <stop offset="100%" stopColor="#260C26"/>
    </radialGradient>
    <linearGradient id="goldPlum2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F7EBDD"/>
      <stop offset="40%" stopColor="#D9B77B"/>
      <stop offset="75%" stopColor="#C49A58"/>
      <stop offset="100%" stopColor="#8B672B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#plumBg2)"/>

  <!-- Ornate Border -->
  <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="url(#goldPlum2)" stroke-width="1.8" opacity="0.6"/>
  <rect x="45" y="45" width="710" height="910" rx="14" fill="none" stroke="url(#goldPlum2)" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Temple Sannidhi Silhouette & Arch -->
  <g transform="translate(400, 420)">
    <circle cx="0" cy="0" r="180" fill="url(#goldPlum2)" opacity="0.08"/>

    <!-- Temple Kalasam Tower -->
    <path d="M0 -160 L15 -130 L-15 -130 Z" fill="url(#goldPlum2)"/>
    <circle cx="0" cy="-165" r="4.5" fill="#F7EBDD"/>
    <path d="M-30 -130 L30 -130 L45 -70 L-45 -70 Z" fill="none" stroke="url(#goldPlum2)" stroke-width="1.8"/>
    <path d="M-60 -70 L60 -70 L80 0 L-80 0 Z" fill="none" stroke="url(#goldPlum2)" stroke-width="1.8"/>
    <path d="M-100 0 L100 0 L120 90 L-120 90 Z" fill="none" stroke="url(#goldPlum2)" stroke-width="2"/>

    <!-- Temple Arch Pillars -->
    <path d="M-90 90 L-90 220 M90 90 L90 220" stroke="url(#goldPlum2)" stroke-width="3"/>
    <path d="M-90 90 Q0 30 90 90" stroke="url(#goldPlum2)" stroke-width="2.5" fill="none"/>

    <!-- Diya Glow in Sanctum -->
    <circle cx="0" cy="160" r="14" fill="#FFAA00" opacity="0.8" filter="drop-shadow(0 0 18px #FFD700)"/>
    <path d="M-20 180 C-20 195 20 195 20 180 Z" fill="url(#goldPlum2)"/>
  </g>

  <!-- Title & Typography -->
  <text x="400" y="800" font-family="Georgia, serif" font-size="24" fill="url(#goldPlum2)" text-anchor="middle" letter-spacing="5">NEELAMKULAGARA DEVI</text>
  <text x="400" y="840" font-family="Georgia, serif" font-size="15" fill="#F7EBDD" text-anchor="middle" letter-spacing="4" opacity="0.8">SACRED BLESSINGS &amp; GRACE</text>
  <text x="400" y="875" font-family="Georgia, serif" font-size="12" fill="#C49A58" text-anchor="middle" letter-spacing="3" opacity="0.7">TEMPLE CEREMONY</text>
</svg>
