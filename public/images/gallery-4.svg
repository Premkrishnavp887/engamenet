<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="plumBg4" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stopColor="#461B43"/>
      <stop offset="55%" stopColor="#34112F"/>
      <stop offset="100%" stopColor="#260C26"/>
    </radialGradient>
    <linearGradient id="goldPlum4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F7EBDD"/>
      <stop offset="35%" stopColor="#D9B77B"/>
      <stop offset="70%" stopColor="#C49A58"/>
      <stop offset="100%" stopColor="#8B672B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#plumBg4)"/>

  <!-- Ornate Border -->
  <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="url(#goldPlum4)" stroke-width="1.8" opacity="0.6"/>
  <rect x="45" y="45" width="710" height="910" rx="14" fill="none" stroke="url(#goldPlum4)" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Two Hearts & Sacred Bell Silhouette -->
  <g transform="translate(400, 430)">
    <circle cx="0" cy="0" r="190" fill="url(#goldPlum4)" opacity="0.05"/>

    <!-- Temple Bell -->
    <path d="M-60 -150 Q0 -190 60 -150 L80 -50 L-80 -50 Z" stroke="url(#goldPlum4)" stroke-width="2" fill="none"/>
    <path d="M-90 -50 L90 -50" stroke="url(#goldPlum4)" stroke-width="3"/>
    <circle cx="0" cy="-20" r="14" fill="url(#goldPlum4)"/>

    <!-- Sacred infinity union loop -->
    <path d="M-60 60 C-110 0 -130 90 -60 140 L0 190 L60 140 C130 90 110 0 60 60 C30 90 0 90 0 90 C0 90 -30 90 -60 60 Z"
          fill="url(#goldPlum4)" opacity="0.8" filter="drop-shadow(0 0 12px rgba(217,183,123,0.3))"/>

    <circle cx="0" cy="110" r="7" fill="#F7EBDD"/>
  </g>

  <!-- Typography -->
  <text x="400" y="800" font-family="Georgia, serif" font-size="26" fill="url(#goldPlum4)" text-anchor="middle" letter-spacing="6">ETERNAL PROMISE</text>
  <text x="400" y="840" font-family="Georgia, serif" font-size="15" fill="#F7EBDD" text-anchor="middle" letter-spacing="4" opacity="0.8">TWO HEARTS · ONE DESTINY</text>
  <text x="400" y="875" font-family="Georgia, serif" font-size="12" fill="#C49A58" text-anchor="middle" letter-spacing="3" opacity="0.7">SUNDAY, 22 NOVEMBER 2026</text>
</svg>
