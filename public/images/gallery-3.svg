<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="emeraldBg3" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#173B2D"/>
      <stop offset="60%" stopColor="#064B38"/>
      <stop offset="100%" stopColor="#092D23"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF4D0"/>
      <stop offset="30%" stopColor="#E2C172"/>
      <stop offset="70%" stopColor="#B99A51"/>
      <stop offset="100%" stopColor="#7E6322"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#emeraldBg3)"/>

  <!-- Ornate Border -->
  <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="url(#gold3)" stroke-width="2" opacity="0.6"/>
  <rect x="45" y="45" width="710" height="910" rx="14" fill="none" stroke="url(#gold3)" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Kasavu Gold Zari & Traditional Lotus Mandala Motif -->
  <g transform="translate(400, 440)">
    <!-- Concentric Zari Borders -->
    <circle cx="0" cy="0" r="190" stroke="url(#gold3)" stroke-width="2" stroke-dasharray="2 4" fill="none" opacity="0.5"/>
    <circle cx="0" cy="0" r="170" stroke="url(#gold3)" stroke-width="6" fill="none" opacity="0.7"/>
    <circle cx="0" cy="0" r="140" stroke="url(#gold3)" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- 8 Blooming Kerala Kasavu Lotus Petals -->
    <path d="M0 -120 C-30 -70 -30 -30 0 0 C30 -30 30 -70 0 -120 Z" fill="url(#gold3)" opacity="0.8"/>
    <path d="M0 120 C-30 70 -30 30 0 0 C30 30 30 70 0 120 Z" fill="url(#gold3)" opacity="0.8"/>
    <path d="M-120 0 C-70 -30 -30 -30 0 0 C-30 30 -70 30 -120 0 Z" fill="url(#gold3)" opacity="0.8"/>
    <path d="M120 0 C70 -30 30 -30 0 0 C30 30 70 30 120 0 Z" fill="url(#gold3)" opacity="0.8"/>

    <!-- Diagonal Petals -->
    <g transform="rotate(45)">
      <path d="M0 -105 C-25 -60 -25 -25 0 0 C25 -25 25 -60 0 -105 Z" fill="url(#gold3)" opacity="0.6"/>
      <path d="M0 105 C-25 60 -25 25 0 0 C25 25 25 60 0 105 Z" fill="url(#gold3)" opacity="0.6"/>
      <path d="M-105 0 C-60 -25 -25 -25 0 0 C-25 25 -60 25 -105 0 Z" fill="url(#gold3)" opacity="0.6"/>
      <path d="M105 0 C60 -25 25 -25 0 0 C25 25 60 25 105 0 Z" fill="url(#gold3)" opacity="0.6"/>
    </g>

    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="22" fill="url(#gold3)"/>
    <circle cx="0" cy="0" r="14" fill="#FAF5EA"/>
    <circle cx="0" cy="0" r="8" fill="#064B38"/>
  </g>

  <!-- Typography -->
  <text x="400" y="810" font-family="Georgia, serif" font-size="26" fill="url(#gold3)" text-anchor="middle" letter-spacing="6">TRADITIONS &amp; HERITAGE</text>
  <text x="400" y="850" font-family="Georgia, serif" font-size="16" fill="#F5EBD5" text-anchor="middle" letter-spacing="4" opacity="0.8">WEAVING TWO FAMILIES TOGETHER</text>
  <text x="400" y="885" font-family="Georgia, serif" font-size="13" fill="#B99A51" text-anchor="middle" letter-spacing="3" opacity="0.7">GOLDEN KASAVU AUSPICIOUSNESS</text>
</svg>
